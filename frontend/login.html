<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar - Ciudad Activa</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<main class="pantalla-centrada">

  <div class="logo">
    <div class="logo-marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-7-10a7 7 0 0 1 14 0c0 5.5-7 10-7 10z"></path><circle cx="12" cy="11" r="2.5"></circle></svg>
    </div>
    <h1>Ciudad Activa</h1>
    <small>Sumate a cuidar tu ciudad</small>
  </div>

  <form action="index.html">
    <div class="campo">
      <label for="email">Correo electronico</label>
      <input type="email" id="email" name="email" placeholder="vecino@correo.com" required>
    </div>

    <div class="campo">
      <label for="password">Contrasena</label>
      <input type="password" id="password" name="password" placeholder="Minimo 8 caracteres" required>
    </div>

    <button type="submit" class="boton boton-primario boton-bloque">Ingresar</button>
  </form>

  <p class="enlace-pie">No tenes cuenta? <a href="registro.html">Registrate</a></p>

</main>

</body>
</html>
